<!DOCTYPE html>
<html lang="hu">
    <head>
        <title>newplace</title>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel='stylesheet' href="./newplace.css">
</head>
<body>
    <header>
        <nav>
            <ul class="navbar">
                <li class="nav-item">
                    <a class="nav-link" href="/">Kezdőlap</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/szallasok">Szállások</a>
                </li>
                <li sec:authorize="hasAuthority('ROLE_vendeglato')" class="nav-item">
                    <a class="nav-link active" href="/add">Szállás létrehozása</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/contact">Kapcsolat</a>
                </li>
                <li sec:authorize="hasAuthority('ROLE_ADMIN')" class="nav-item">
                    <a class="nav-link" href="/admin">ADMIN</a>
                </li>
                <li sec:authorize="!isAuthenticated()" class="nav-item" style="float:right">
                    <a class="nav-link active" href="/login">Bejelentkezés</a>
                </li>
                <li sec:authorize="!isAuthenticated()" class="nav-item" style="float:right">
                    <a class="nav-link" href="/register">Regisztráció</a>
                </li>
                <li sec:authorize="isAuthenticated()" class="nav-item" style="float:right">
                    <a class="nav-link" href="/profil">Profil</a>
                </li>
                <li sec:authorize="isAuthenticated()" class="nav-item" style="float:right">
                    <a class="nav-link" href="/logout">Kijelentkezés</a>
                </li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <h1>Új Szállás Hozzáadása</h1>
        <div class="form-container">
            <form action="/" th:action="@{/add}" method="post">
                <label for="szallasNev">Szállás Neve:</label>
                <input type="text" id="szallasNev" name="nev" required>

                <label for="helyszin">Irányítószám:</label>
                <input type="text" id="helyszin" name="isz" required>

                <label for="varos">Város:</label>
                <input type="text" id="varos" name="varos" required>

                <label for="utca">Utca:</label>
                <input type="text" id="utca" name="utca" required>

                <label for="leiras">Leírás:</label>
                <input type="text" id="leiras" name="leiras" required>

                <label for="ar">Ár (Forint/Éjszaka):</label>
                <input type="number" id="ar" name="ar" required min="1">

                <button type="submit" class="button">Szállás Hozzáadása</button>
            </form>
        </div>
    </div>

    <script>
       
        document.getElementById('szallasForm').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('A szállás sikeresen hozzáadva!');
            this.reset();
        });
    </script>
    <footer>
        <div class="footer-column">
           <h3 class="footer-title">Rólunk</h3>
           <ul class="footer-list">
              <li class="footer-list-item">
                 <a href="https://git-okt.sed.inf.szte.hu/2024-ib153i-3-szallas" target="_blank">GitLab elérhetőség</a>
              </li>
           </ul>
        </div>
        <div class="footer-column">
           <h3 class="footer-title">Nem vagy még tag?</h3>
           <ul class="footer-list">
              <li class="footer-list-item">
                 <a href="/register">Regisztráció</a>
              </li>
           </ul class="footer-list">
        </div>
        <div class="footer-column">
           <h3 class="footer-title">Kérdésed van?</h3>
           <ul class="footer-list">
              <li class="footer-list-item">
                 <a href="/contact">Kapcsolat</a>
              </li>
           </ul>
        </div>
     </footer>
</body>
</html>
